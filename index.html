
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b45">

  <title>CHJB POULTRY MANAGER</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f5f2;
      color: #20352a;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
      margin-top: 20px;
    }

    .header {
      text-align: center;
      background: #176b45;
      color: white;
      padding: 25px 15px;
      border-radius: 16px;
    }

    .header h2 {
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      opacity: .9;
    }

    #status {
      text-align: center;
      padding: 20px 5px;
      font-size: 15px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .menu-item {
      background: white;
      border: 1px solid #e2eae4;
      border-radius: 14px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      min-height: 105px;
      box-shadow: 0 2px 8px #00008;
      color: #20352a;
      font-size: 14px;
      font-weight: bold;
    }

    .menu-item:active {
      background: #e4f2e9;
      transform: scale(.98);
    }

    .menu-item .emoji {
      display: block;
      font-size: 29px;
      margin-bottom: 10px;
    }

    .hidden {
      display: none !important;
    }

    .section-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .back-btn {
      width: 100%;
      border: none;
      padding: 14px;
      background: #176b45;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    .user-info {
      text-align: center;
      font-size: 13px;
      color: #d9f3e3;
      margin-top: 12px;
    }

    .footer {
      text-align: center;
      color: #809087;
      font-size: 12px;
      margin: 25px 0 10px;
    }

    @media (max-width: 350px) {
      .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- КИРИШ ОЙНАСИ -->

  <div id="loginScreen">

    <div class="header">
      <h2>CHJB POULTRY MANAGER</h2>
      <p>Паррандачилик бошқарув тизими</p>
    </div>

    <div class="card">
      <div id="status">
        Telegram маълумотлари текширилмоқда...
      </div>
    </div>

  </div>


  <!-- АСОСИЙ БОШҚАРУВ МЕНЮСИ -->

  <div id="mainScreen" class="hidden">

    <div class="header">
      <h2>CHJB POULTRY MANAGER</h2>
      <p>Асосий бошқарув панели</p>

      <div class="user-info" id="userInfo">
        Фойдаланувчи
      </div>
    </div>

    <div class="menu">

      <button class="menu-item" onclick="openSection('birds')">
        <span class="emoji">🐔</span>
        Паррандалар ҳисоби
      </button>

      <button class="menu-item" onclick="openSection('income')">
        <span class="emoji">📥</span>
        Парранда кирими
      </button>

      <button class="menu-item" onclick="openSection('movement')">
        <span class="emoji">🔄</span>
        Кўчириш
      </button>

      <button class="menu-item" onclick="openSection('transfer')">
        <span class="emoji">🐣</span>
        Парранда турини ўзгартириш
      </button>

      <button class="menu-item" onclick="openSection('mortality')">
        <span class="emoji">⚰️</span>
        Нобуд бўлиш
      </button>

      <button class="menu-item" onclick="openSection('slaughter')">
        <span class="emoji">🔪</span>
        Сўйиш
      </button>

      <button class="menu-item" onclick="openSection('sales')">
        <span class="emoji">🛒</span>
        Реализация
      </button>

      <button class="menu-item" onclick="openSection('weight')">
        <span class="emoji">⚖️</span>
        Вазн ва привес
      </button>

      <button class="menu-item" onclick="openSection('eggs')">
        <span class="emoji">🥚</span>
        Тухум ҳисоби
      </button>

      <button class="menu-item" onclick="openSection('feed')">
        <span class="emoji">🌾</span>
        Ем-хашак
      </button>

      <button class="menu-item" onclick="openSection('vaccine')">
        <span class="emoji">💉</span>
        Вакцинация
      </button>

      <button class="menu-item" onclick="openSection('reports')">
        <span class="emoji">📊</span>
        Ҳисоботлар
      </button>

    </div>

    <div class="footer">
      CHJB POULTRY MANAGER © 2026
    </div>

  </div>


  <!-- БЎЛИМЛАРНИНГ ИШ ОЙНАСИ -->

  <div id="sectionScreen" class="hidden">

    <div class="header">
      <h2 id="sectionName">Бўлим</h2>
      <p>CHJB POULTRY MANAGER</p>
    </div>

    <div class="card">

      <div class="section-title">
        <h3 id="sectionHeading"></h3>
        <p id="sectionDescription">
          Ушбу бўлимнинг ишлаш жараёни кейинги босқичда яратилади.
        </p>
      </div>

      <button class="back-btn" onclick="backToMenu()">
        ← Асосий менюга қайтиш
      </button>

    </div>

  </div>

</div>


<!-- GOOGLE APPS SCRIPT POST -->

<iframe
  name="chjbAuthFrame"
  id="chjbAuthFrame"
  style="display:none">
</iframe>

<form
  id="authForm"
  method="POST"
  target="chjbAuthFrame"
  action="https://script.google.com/macros/s/AKfycbxI1OBSF1AVEx3lFcwf7C2iO_ahHuLJ85LRFhWQiR2NoUdxKv8iN1jEHw7TyYsZt9hK/exec">

  <input
    type="hidden"
    name="initData"
    id="initData">

</form>


<script>

  const statusBox = document.getElementById("status");

  const loginScreen = document.getElementById("loginScreen");
  const mainScreen = document.getElementById("mainScreen");
  const sectionScreen = document.getElementById("sectionScreen");

  let authCompleted = false;
  let authStarted = false;


  // СТАТУС

  function showStatus(message) {
    statusBox.textContent = message;
  }


  // АСОСИЙ МЕНЮНИ ОЧИШ

  function showMainMenu(result) {

    loginScreen.classList.add("hidden");
    sectionScreen.classList.add("hidden");
    mainScreen.classList.remove("hidden");

    const tg = window.Telegram.WebApp;

    const firstName = tg.initDataUnsafe?.user?.first_name || "";
    const lastName = tg.initDataUnsafe?.user?.last_name || "";

    const fullName = (firstName + " " + lastName).trim();

    document.getElementById("userInfo").textContent =
      fullName ? "Хуш келибсиз, " + fullName : "Авторизация тасдиқланди";

    if (tg.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred("success");
    }

  }


  // БЎЛИМНИ ОЧИШ

  const sections = {

    birds: "Паррандалар ҳисоби",
    income: "Парранда кирими",
    movement: "Паррандаларни кўчириш",
    transfer: "Парранда турини ўзгартириш",
    mortality: "Нобуд бўлиш ҳисоби",
    slaughter: "Сўйиш ҳисоби",
    sales: "Реализация",
    weight: "Вазн ва привес",
    eggs: "Тухум ҳисоби",
    feed: "Ем-хашак ҳисоби",
    vaccine: "Вакцинация",
    reports: "Ҳисоботлар"

  };


  function openSection(sectionId) {

    const name = sections[sectionId];

    if (!name) return;

    mainScreen.classList.add("hidden");
    sectionScreen.classList.remove("hidden");

    document.getElementById("sectionName").textContent = name;
    document.getElementById("sectionHeading").textContent = name;

    if (window.Telegram?.WebApp?.HapticFeedback) {
      Telegram.WebApp.HapticFeedback.selectionChanged();
    }

  }


  // МЕНЮГА ҚАЙТИШ

  function backToMenu() {

    sectionScreen.classList.add("hidden");
    mainScreen.classList.remove("hidden");

  }


  // GOOGLE СЕРВЕРДАН ЖАВОБ

  window.addEventListener("message", function(event) {

    let hostname;

    try {
      hostname = new URL(event.origin).hostname;
    } catch (e) {
      return;
    }

    if (
      hostname !== "googleusercontent.com" &&
      !hostname.endsWith(".googleusercontent.com")
    ) {
      return;
    }

    if (!event.data || event.data.type !== "CHJB_AUTH_RESULT") {
      return;
    }

    const result = event.data.data;

    if (result && result.ok === true) {

      authCompleted = true;

      showMainMenu(result);

    } else {

      authCompleted = true;

      showStatus(
        "Авторизация амалга ошмади. Илтимос, қайта уриниб кўринг."
      );

    }

  });


  // TELEGRAM АВТОРИЗАЦИЯСИ

  window.addEventListener("load", function() {

    const tg = window.Telegram && window.Telegram.WebApp;

    if (!tg) {
      showStatus("Telegram иловасини очишда хатолик юз берди.");
      return;
    }

    tg.ready();
    tg.expand();

    const initData = tg.initData || "";

    if (!initData) {

      showStatus(
        "Telegram маълумоти топилмади. Илтимос, бот орқали очинг."
      );

      return;

    }

    document.getElementById("initData").value = initData;

    showStatus("Авторизация текширилмоқда...");

    authStarted = true;

    const authFrame = document.getElementById("chjbAuthFrame");
    const form = document.getElementById("authForm");

    form.submit();

    // ХАВФСИЗ ХАТОЛИК ХАБАРИ

    setTimeout(function() {

      if (authStarted && !authCompleted) {

        showStatus(
          "Сервер билан боғланишда хатолик. Илтимос, қайта уриниб кўринг."
        );

      }

    }, 20000);

  });

</script>

</body>
</html>
