
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHJB POULTRY MANAGER</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f2f5f3;
      color: #20352a;
    }
    .card {
      max-width: 480px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 3px 15px #0001;
    }
    h2 { margin-bottom: 8px; }
    #status { margin-top: 20px; }
    pre {
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>CHJB POULTRY MANAGER</h2>
    <p>Паррандачилик бошқарув тизими</p>
    <div id="status">Telegram маълумотлари текширилмоқда...</div>
    <pre id="details"></pre>
  </div>

  <iframe name="chjbAuthFrame" id="chjbAuthFrame"
          style="display:none"></iframe>

  <form id="authForm"
        method="POST"
        target="chjbAuthFrame"
        action="https://script.google.com/macros/s/AKfycbxI1OBSF1AVEx3lFcwf7C2iO_ahHuLJ85LRFhWQiR2NoUdxKv8iN1jEHw7TyYsZt9hK/exec">
    <input type="hidden" name="initData" id="initData">
  </form>

  <script>
    const statusBox = document.getElementById("status");
    const detailsBox = document.getElementById("details");
    const authFrame = document.getElementById("chjbAuthFrame");

    function showStatus(message) {
      statusBox.textContent = message;
    }

    // Сервердан келадиган жавобни қабул қилиш
    window.addEventListener("message", function(event) {
      if (!event.origin.endsWith(".googleusercontent.com")) return;
    
      if (!event.data || event.data.type !== "CHJB_AUTH_RESULT") {
        return;
      }
    
      const result = event.data.data;
    
      if (result && result.ok === true) {
        showStatus("Муваффақиятли авторизация!");
      } else {
        showStatus("Авторизация хатоси: " +
          (result.message || "Номаълум хатолик"));
      }
    
      detailsBox.textContent = JSON.stringify(result, null, 2);
    });
    // Telegram маълумотларини олиш
    window.addEventListener("load", function() {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (!tg) {
        showStatus("Telegram SDK юкланмади.");
        return;
      }

      tg.ready();
      tg.expand();

      const initData = tg.initData || "";

      if (!initData) {
        showStatus("Telegram маълумоти топилмади. Илтимос, бот орқали очинг.");
        detailsBox.textContent =
          "Platform: " + (tg.platform || "unknown") +
          "\nInitData узунлиги: 0";
        return;
      }

      document.getElementById("initData").value = initData;
      showStatus("Telegram маълумотлари серверга юборилмоқда...");

      const form = document.getElementById("authForm");

showStatus("1. Telegram маълумоти тайёрланди. Серверга POST юборилмоқда...");

authFrame.onload = function() {
  showStatus("2. Сервер жавоби iframe'га юкланди. postMessage кутилмоқда...");
};

form.submit();

setTimeout(function() {
  if (statusBox.textContent.includes("POST юборилмоқда")) {
    showStatus("ХАТО: сервердан жавоб юкланмади. POST сўрови ёки сервер манзилини текшириш керак.");
  }
}, 15000);
    });
  </script>
</body>
</html>
